repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: security-scan
        name: Offline secret and dangerous-pattern scan
        entry: python scripts/security_scan.py --root .
        language: system
        pass_filenames: false
      - id: i18n-guard
        name: English locale has no Persian text (requires a running web server)
        entry: node scripts/check-i18n.mjs
        language: system
        pass_filenames: false
        stages: [manual]
