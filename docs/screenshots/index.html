<!DOCTYPE html>

<title>Digital Shopping — Screenshot Gallery</title>
<style>
  :root{--ink:#0B0716;--paper:#F5EFE6;--violet:#A855F7;--cyan:#22D3EE}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Tahoma,sans-serif;color:#F7F3FF;background:radial-gradient(800px 420px at 12% 0%,rgba(124,58,237,.3),transparent 65%),radial-gradient(700px 400px at 90% 10%,rgba(34,211,238,.14),transparent 60%),#080512}
  header{max-width:1180px;margin:0 auto;padding:46px 22px 18px}
  h1{font-size:clamp(28px,4vw,48px);margin:0 0 8px;background:linear-gradient(100deg,#fff,#C084FC 55%,#67E8F9);-webkit-background-clip:text;background-clip:text;color:transparent}
  header p{color:#B9AECB;line-height:1.8;max-width:760px}
  .grid{max-width:1180px;margin:0 auto;padding:18px 22px 70px;display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:22px}
  figure{margin:0;border:1px solid rgba(255,255,255,.12);border-radius:16px;overflow:hidden;background:#120C22;box-shadow:0 18px 42px rgba(0,0,0,.35)}
  figure img{width:100%;height:auto;display:block;aspect-ratio:1440/900;object-fit:cover;object-position:top}
  figcaption{padding:12px 16px 16px;font-size:14px;color:#E9D5FF}
  figcaption small{display:block;color:#8B7FA3;font-size:12px;margin-top:4px}
  a{color:#67E8F9}
  footer{max-width:1180px;margin:0 auto;padding:0 22px 60px;color:#8B7FA3;font-size:13px;line-height:1.8}
</style>
