# پیکربندی Alertmanager — مقادیر ${...} توسط ops/monitoring/render-alertmanager.sh
# از متغیرهای محیطی جایگزین میشوند. پیشفرضها بیخطراند (هیچ اعلانی به بیرون نمیرود).
# اجرا: bash ops/monitoring/render-alertmanager.sh > /etc/alertmanager/alertmanager.yml
global:
  resolve_timeout: 5m
  smtp_smarthost: '${SMTP_SMARTHOST}'
  smtp_from: '${SMTP_FROM}'
  smtp_require_tls: '${SMTP_REQUIRE_TLS}'

route:
  receiver: records
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: critical
      repeat_interval: 1h

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: ["alertname"]

receivers:
  # گیرندهٔ پیشفرض: وب هوک داخلی/خارجی از طریق ALERT_WEBHOOK_URL.
  - name: records
    webhook_configs:
      - url: '${ALERT_WEBHOOK_URL}'
        send_resolved: true
  # هشدارهای بحرانی: Slack از طریق SLACK_WEBHOOK_URL (api_url کامل webhook).
  - name: critical
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#codex-alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
  # گیرندهٔ ایمیلی اختیاری: فقط وقتی EMAIL_TO و SMTP تنظیم شده باشند.
  - name: email
    email_configs:
      - to: '${EMAIL_TO}'
        send_resolved: true
        headers:
          Subject: '[Codex] {{ .CommonLabels.alertname }}'
