global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: digital-shopping

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]

  # بکاند: متریکهای دستساز RED + شمارندههای دامنه (/api/v1/metrics).
  # در صورت تنظیم METRICS_TOKEN، هدر Authorization توسط Prometheus ارسال میشود.
  - job_name: digital-shopping-api
    static_configs: [{ targets: ["api:8000"] }]
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token

  # صادرکنندهٔ Postgres (برای up{job="postgres"} و سلامت اتصال).
  - job_name: postgres
    static_configs: [{ targets: ["postgres-exporter:9187"] }]

  - job_name: redis
    static_configs: [{ targets: ["redis:6379"] }]

  - job_name: node
    static_configs: [{ targets: ["node-exporter:9100"] }]

alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]
