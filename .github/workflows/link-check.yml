name: Link Check

on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "**.md"
      - "docs/**"
      - ".lychee.toml"

permissions:
  contents: read

jobs:
  links:
    name: Validate documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --no-progress --timeout 25 --exclude-loopback --exclude-path docs/internal "**/*.md"
          fail: true
