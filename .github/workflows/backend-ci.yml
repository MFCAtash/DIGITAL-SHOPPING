name: backend-ci
on:
  pull_request:
    paths: ["backend/**", "overlay/data/**", "overlay/public/products/**", ".github/workflows/backend-ci.yml"]
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: codex
          POSTGRES_USER: codex
          POSTGRES_PASSWORD: codex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U codex" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SECRET_KEY: ci-only-secret
      DATABASE_URL: postgres://codex:codex@localhost:5432/codex
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/constraints.txt
      - name: Install (با constraints.txt اگر commit شده باشد)
        run: pip install -r requirements-dev.txt $(test -f constraints.txt && echo "-c constraints.txt")
      - name: Lint
        run: ruff check .
      - name: Pure unit tests (no database)
        run: python -m unittest discover -s tests/pure -t . -v
      - name: Migrations are committed
        run: python manage.py makemigrations --check --dry-run
      - name: Migrate on empty Postgres, twice (idempotent)
        run: |
          python manage.py migrate --noinput
          python manage.py migrate --noinput
          python manage.py migrate --check
      - name: Django system check
        run: python manage.py check
      - name: Django deploy check (prod settings, zero warnings)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          ALLOWED_HOSTS: shop.example.com
          CSRF_TRUSTED_ORIGINS: https://shop.example.com
          CORS_ALLOWED_ORIGINS: https://shop.example.com
          SMS_GATEWAY: apps.accounts.sms.HttpSms
          SMS_SEND_INLINE: "false"
          # مقادیر زیر راز واقعی نیستند؛ مقادیر ثابت CIاند و در .gitleaks.toml مجازاند.
          OTP_SECRET: 4f21a9c7e80b6d53fa17c248e9b605d37a1f4c8d29e670b5a3f1098dc42e6b71
          PAYMENT_GATEWAY: http
          PAYMENT_START_URL: https://pay.example.com/start
          PAYMENT_VERIFY_URL: https://pay.example.com/verify
          PAYMENT_API_KEY: ci-only-key
          PAYMENT_CALLBACK_SECRET: b6e41c9d82a7503fc14a8b27e690d5f3a7c218b4e9d06f582ca13e7b49d0f2685
          METRICS_TOKEN: 9d8c4b1a76e25f03c9a148db5e072f6b3d91ac48fe720b6519c4d8a3f27e0b95
          REDIS_URL: redis://localhost:6379/0
          ADMIN_ALLOWED_IPS: 127.0.0.1/32
          FRONTEND_URL: https://shop.example.com
          PUBLIC_BASE_URL: https://shop.example.com
          DATABASE_URL: postgres://codex:codex@localhost:5432/codex?sslmode=require
        run: |
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          python manage.py check --deploy --fail-level WARNING
      - name: Catalog dry-run (project rules)
        run: python manage.py import_catalog --dry-run
      - name: Tests (database, concurrency) with coverage
        run: pytest -q -n 2 --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Coverage gate for money-critical apps (orders, pricing >= 90%)
        run: coverage report --include="apps/orders/*,apps/pricing/*" --fail-under=90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: backend/coverage.xml
# معادل برای Gitea/Woodpecker یا GitLab CI: همین دستورها را در همان ترتیب اجرا کنید.
