name: Release Assets

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to attach assets to
        required: true

permissions:
  contents: write

jobs:
  assets:
    name: Attach cover, posters and checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Generate checksums
        run: |
          cd docs/github-posters
          sha256sum cover.png cover@2x.png cover.svg > SHA256SUMS.txt
          cd ../screenshots
          sha256sum *.webp > SHA256SUMS.txt
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          overwrite_files: true
          generate_release_notes: true
          files: |
            docs/github-posters/cover.png
            docs/github-posters/cover@2x.png
            docs/github-posters/cover.svg
            docs/github-posters/SHA256SUMS.txt
            docs/screenshots/SHA256SUMS.txt
            LICENSE
            NOTICE
