name: security

on:
  pull_request:
  push:
    branches: [main]
  # بازبینی هفتگی وابستگی‌ها حتی بدون تغییر کد (جایگزین به‌روزرسانی خودکار نسخه‌ها).
  schedule:
    - cron: "0 5 * * 1"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # کل تاریخچه: رازِ «حذفشده» در commit قدیمی هم پیدا میشود
      - name: Secret scan (gitleaks, including history)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect \
            --source /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Secret & dangerous-pattern scan (offline, including git history)
        run: python scripts/security_scan.py --root . --git

  pip-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit && pip-audit -r requirements.txt && pip-audit -r requirements-dev.txt

  npm-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [apps/web, packages/ui]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
